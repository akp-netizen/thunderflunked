# Render Blueprint for THUNDERFLUNKED 2.0.
#
# This provisions a SEPARATE web service and PostgreSQL database (names below). It
# does NOT touch any existing production service: your current site keeps running
# from whatever service/branch it already uses. Deploy this by going to the Render
# dashboard -> New + -> Blueprint, and selecting this repository on the
# `redesign/usability` branch.
#
# Notes:
#   * One Gunicorn worker + eight threads is REQUIRED: the live game is held in
#     memory and mirrored to Postgres; a second worker would split the game across
#     separate memories. Do not change --workers 1.
#   * SECRET_KEY is auto-generated by Render (strong, never printed anywhere).
#   * GM_PASSWORD is marked sync:false, so Render prompts you to set it at deploy
#     time (choose a strong, memorable value). It is never stored in this file.
#   * DATABASE_URL is wired automatically from the managed database below.
#   * Free plans are fine for a workshop. Free Postgres is removed after ~90 days;
#     upgrade the database plan if you need it to live longer.

services:
  - type: web
    name: thunderflunked-2
    runtime: python
    region: ohio                 # nearest US-Midwest region; the DB below must match
    branch: redesign/usability
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true      # Render creates a strong random value
      - key: GM_PASSWORD
        sync: false              # you set this in the dashboard at deploy time
      - key: DATABASE_URL
        fromDatabase:
          name: thunderflunked-2-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: thunderflunked-2-db
    plan: free
    region: ohio                 # must match the web service region above
